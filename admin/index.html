<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>空城AI WebUI</title>
  <style>
    :root {
      --bg: #f4f8f7;
      --bg-soft: #e9f3ef;
      --card: #ffffff;
      --line: #d2dfda;
      --text: #213336;
      --muted: #5f767b;
      --brand: #0f766e;
      --brand-2: #16a085;
      --accent: #d97706;
      --danger: #be123c;
      --ok: #15803d;
      --shadow: 0 12px 32px rgba(16, 48, 52, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 12% -8%, #dff2ff 0, transparent 40%),
        radial-gradient(circle at 95% 20%, #e7f7ea 0, transparent 35%),
        linear-gradient(180deg, #f8fbfa 0%, var(--bg) 100%);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei UI", sans-serif;
    }

    .wrap {
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 14px 24px;
    }

    .hero {
      background: linear-gradient(135deg, #0f766e, #199f88 72%);
      color: #ffffff;
      border-radius: 18px;
      padding: 18px 18px 14px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      right: -100px;
      top: -150px;
      background: rgba(255, 255, 255, 0.16);
      pointer-events: none;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.8px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .hero .sub {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.94;
      position: relative;
      z-index: 1;
    }

    .hero-kpis {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(2px);
      white-space: nowrap;
    }

    .status-ok {
      color: #ecfdf5;
      border-color: rgba(209, 250, 229, 0.7);
      background: rgba(20, 120, 70, 0.35);
    }

    .status-off {
      color: #fef3c7;
      border-color: rgba(253, 224, 71, 0.55);
      background: rgba(120, 113, 18, 0.35);
    }

    .layout {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
      align-items: start;
    }

    .col {
      display: grid;
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .tip {
      font-size: 12px;
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label.field {
      display: block;
      margin-top: 8px;
    }

    label.field > span {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    input,
    textarea,
    button {
      border-radius: 10px;
      font-size: 14px;
      border: 1px solid var(--line);
    }

    input,
    textarea {
      width: 100%;
      padding: 9px 10px;
      color: var(--text);
      background: #ffffff;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    input:focus,
    textarea:focus {
      border-color: #6fbfb4;
      box-shadow: 0 0 0 3px rgba(111, 191, 180, 0.2);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.45;
    }

    .bad-input {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.16);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text);
      margin-top: 10px;
      user-select: none;
    }

    .toggle input {
      width: auto;
      margin: 0;
    }

    .actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      border: none;
      padding: 9px 12px;
      min-width: 118px;
      color: #ffffff;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      transition: transform 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
      filter: none;
    }

    .btn-secondary {
      background: #ebf4f2;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .btn-warn {
      background: linear-gradient(120deg, #b45309, var(--accent));
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .status-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: linear-gradient(180deg, #ffffff, #f8fbfa);
    }

    .status-item b {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 2px;
      font-weight: 600;
    }

    .status-item span {
      display: block;
      font-size: 13px;
      word-break: break-all;
    }

    .tags {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      border-radius: 999px;
      border: 1px solid #c7d8d3;
      background: #f3f9f7;
      color: #335c59;
      padding: 2px 9px;
      font-size: 12px;
    }

    .result-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .result-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .output {
      margin: 0;
      min-height: 170px;
      background: #102129;
      color: #d7f8ef;
      border-radius: 11px;
      border: 1px solid #254451;
      padding: 11px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.42;
      font-family: Consolas, "Courier New", monospace;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 8px;
    }

    .preview-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #fcfefd;
    }

    .preview-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #d8e8e2;
      display: block;
    }

    .preview-card a {
      display: inline-block;
      margin-top: 6px;
      font-size: 12px;
      color: #0f766e;
      text-decoration: none;
      word-break: break-all;
    }

    .preview-empty {
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #f8fcfb;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 260px;
      overflow: auto;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #f9fcfb;
      font-size: 12px;
    }

    .history-item b {
      font-size: 13px;
    }

    .history-meta {
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }

    .history-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .history-actions button {
      min-width: auto;
      padding: 4px 8px;
      font-size: 12px;
    }

    .cmd-preview {
      margin: 0;
      min-height: 124px;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f6fbf8;
      border: 1px dashed #bfd8d0;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
      font-family: Consolas, "Courier New", monospace;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #f8fffd;
      background: rgba(10, 70, 61, 0.93);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(202, 255, 240, 0.25);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      max-width: min(88vw, 400px);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.err {
      background: rgba(123, 18, 52, 0.94);
      border-color: rgba(251, 191, 210, 0.35);
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .hero h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <h1>空城AI 配置与联调台</h1>
      <div class="sub">同页完成供应商切换、配置保存、生图/视频任务联调与结果预览</div>
      <div class="hero-kpis">
        <span class="pill" id="pillRunning">WebUI 未就绪</span>
        <span class="pill" id="pillImageProvider">生图: -</span>
        <span class="pill" id="pillVideoProvider">视频: -</span>
        <span class="pill" id="pillPing">延迟: -</span>
      </div>
    </section>

    <section class="layout">
      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>运行状态</h2>
            <div class="actions" style="margin:0;">
              <button class="btn-secondary" id="btnPing">健康检查</button>
              <button class="btn-secondary" id="btnRefresh">刷新状态</button>
            </div>
          </div>
          <div class="status-grid" id="stateGrid">
            <div class="status-item"><b>状态</b><span>加载中</span></div>
          </div>
          <div class="tags" id="providerTags"></div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>配置管理</h2>
            <span class="tip">支持运行时应用与持久化保存</span>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>selected_image_provider</span>
              <input id="selectedImage" placeholder="如 zhipu / openai_image / 自定义name" />
            </label>
            <label class="field">
              <span>selected_video_provider</span>
              <input id="selectedVideo" placeholder="如 zhipu / seedance / 自定义name" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>webui_host</span>
              <input id="webuiHost" placeholder="127.0.0.1 或 0.0.0.0" />
            </label>
            <label class="field">
              <span>webui_port</span>
              <input id="webuiPort" placeholder="8765" />
            </label>
          </div>
          <label class="toggle">
            <input type="checkbox" id="webuiEnabled" />
            webui_enabled
          </label>

          <label class="field">
            <span>zhipu_api_key</span>
            <input id="zhipuApiKey" type="password" placeholder="智谱 API Key" />
          </label>
          <div class="grid-2">
            <label class="field">
              <span>zhipu_api_base</span>
              <input id="zhipuApiBase" placeholder="https://open.bigmodel.cn/api/paas/v4" />
            </label>
            <label class="field">
              <span>zhipu_video_model</span>
              <input id="zhipuVideoModel" placeholder="CogVideoX-Flash" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>zhipu_image_model</span>
              <input id="zhipuImageModel" placeholder="glm-image" />
            </label>
            <label class="toggle" style="margin-top: 26px;">
              <input type="checkbox" id="zhipuVideoWithAudio" />
              zhipu_video_with_audio
            </label>
          </div>

          <label class="field">
            <span>seedance_api_key</span>
            <input id="seedanceApiKey" type="password" placeholder="Seedance API Key" />
          </label>
          <div class="grid-2">
            <label class="field">
              <span>seedance_api_base</span>
              <input id="seedanceApiBase" placeholder="https://seedanceapi.org/v1" />
            </label>
            <label class="field">
              <span>seedance_video_model</span>
              <input id="seedanceVideoModel" placeholder="可选" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>seedance_resolution</span>
              <input id="seedanceResolution" placeholder="1080p" />
            </label>
            <label class="field">
              <span>seedance_duration</span>
              <input id="seedanceDuration" placeholder="5" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>seedance_aspect_ratio</span>
              <input id="seedanceAspectRatio" placeholder="16:9" />
            </label>
            <label class="field">
              <span>seedance_generate_path</span>
              <input id="seedanceGeneratePath" placeholder="/generate" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>seedance_status_path</span>
              <input id="seedanceStatusPath" placeholder="/status" />
            </label>
            <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:26px;">
              <label class="toggle" style="margin-top:0;">
                <input type="checkbox" id="seedanceGenerateAudio" />
                seedance_generate_audio
              </label>
              <label class="toggle" style="margin-top:0;">
                <input type="checkbox" id="seedanceFixedLens" />
                seedance_fixed_lens
              </label>
            </div>
          </div>

          <label class="field">
            <span>openai_image_api_key</span>
            <input id="openaiImageApiKey" type="password" placeholder="OpenAI兼容 API Key" />
          </label>
          <div class="grid-2">
            <label class="field">
              <span>openai_image_api_base</span>
              <input id="openaiImageApiBase" placeholder="https://api.openai.com/v1" />
            </label>
            <label class="field">
              <span>openai_image_model</span>
              <input id="openaiImageModel" placeholder="gpt-image-1" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>openai_image_generate_path</span>
              <input id="openaiImageGeneratePath" placeholder="/images/generations" />
            </label>
            <label class="field">
              <span>openai_image_edit_path</span>
              <input id="openaiImageEditPath" placeholder="可选" />
            </label>
          </div>

          <div class="grid-2">
            <label class="field">
              <span>default_image_size</span>
              <input id="defaultImageSize" placeholder="1024x1024" />
            </label>
            <label class="field">
              <span>request_timeout_seconds</span>
              <input id="requestTimeoutSeconds" placeholder="90" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>request_retry_count</span>
              <input id="requestRetryCount" placeholder="1" />
            </label>
            <label class="field">
              <span>download_timeout_seconds</span>
              <input id="downloadTimeoutSeconds" placeholder="120" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>min_request_interval_seconds</span>
              <input id="minRequestIntervalSeconds" placeholder="3" />
            </label>
            <label class="field">
              <span>max_cache_files</span>
              <input id="maxCacheFiles" placeholder="20" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>max_image_size_mb</span>
              <input id="maxImageSizeMb" placeholder="10" />
            </label>
            <label class="field">
              <span>max_video_size_mb</span>
              <input id="maxVideoSizeMb" placeholder="100" />
            </label>
          </div>
          <label class="field">
            <span>default_i2i_prompt</span>
            <input id="defaultI2iPrompt" placeholder="图生图默认提示词" />
          </label>
          <label class="field">
            <span>default_i2v_prompt</span>
            <input id="defaultI2vPrompt" placeholder="图生视频默认提示词" />
          </label>
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-top:6px;">
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="returnImageUrl" />
              return_image_url
            </label>
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="returnVideoUrl" />
              return_video_url
            </label>
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="attachImageResult" />
              attach_image_result
            </label>
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="attachVideoResult" />
              attach_video_result
            </label>
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="saveImageLocal" />
              save_image_local
            </label>
            <label class="toggle" style="margin-top:0;">
              <input type="checkbox" id="saveVideoLocal" />
              save_video_local
            </label>
          </div>

          <label class="field">
            <span>custom_image_providers_json</span>
            <textarea id="customImageJson" placeholder='[{"name":"myimg","api_key":"sk-xxx","api_base":"https://api.example.com/v1"}]'></textarea>
          </label>
          <div class="actions">
            <button class="btn-secondary" id="btnFillImageTpl">填充生图模板</button>
          </div>
          <label class="field">
            <span>custom_video_providers_json</span>
            <textarea id="customVideoJson" placeholder='[{"name":"myvideo","api_key":"sk-xxx","api_base":"https://api.example.com/v1"}]'></textarea>
          </label>
          <div class="actions">
            <button class="btn-secondary" id="btnFillVideoTpl">填充视频模板</button>
          </div>

          <div class="actions">
            <button id="btnApplyConfig">测试应用(不保存)</button>
            <button class="btn-secondary" id="btnPersistConfig">保存配置(同步插件)</button>
            <button class="btn-secondary" id="btnFormatJson">格式化 JSON</button>
          </div>
          <div class="footer-note">只有“保存配置(同步插件)”会写入插件配置；测试应用只在当前运行期生效。</div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>命令助手</h2>
            <button class="btn-secondary" id="btnCopyCmd">复制命令</button>
          </div>
          <pre class="cmd-preview" id="cmdPreview">等待状态加载...</pre>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <div class="card-head">
            <h2>生图测试</h2>
            <span class="tip">文本 -> 图片</span>
          </div>
          <label class="field">
            <span>prompt</span>
            <input id="imgPrompt" value="一只机械猫，插画风，高清细节" />
          </label>
          <label class="field">
            <span>size</span>
            <input id="imgSize" value="1024x1024" />
          </label>
          <div class="actions">
            <button id="btnTestImage">测试生图</button>
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>视频测试</h2>
            <span class="tip">提交与查询</span>
          </div>
          <label class="field">
            <span>prompt</span>
            <input id="videoPrompt" value="一艘飞船穿越云层，电影感镜头，光影流动" />
          </label>
          <div class="actions">
            <button id="btnTestVideo">提交视频任务</button>
            <button class="btn-secondary" id="btnQueryVideo">查询任务</button>
          </div>
          <label class="field">
            <span>task_id</span>
            <input id="videoTaskId" placeholder="提交后自动回填 task_id" />
          </label>
          <div class="grid-2">
            <label class="field">
              <span>轮询间隔(秒)</span>
              <input id="pollInterval" value="5" />
            </label>
            <label class="field">
              <span>轮询上限(次)</span>
              <input id="pollMaxRounds" value="40" />
            </label>
          </div>
          <label class="toggle">
            <input type="checkbox" id="autoPollAfterSubmit" checked />
            提交成功后自动轮询
          </label>
          <div class="actions">
            <button class="btn-warn" id="btnStartPoll">开始轮询</button>
            <button class="btn-secondary" id="btnStopPoll">停止轮询</button>
          </div>
          <div class="footer-note" id="pollStatus">轮询状态: 未启动</div>
        </section>

        <section class="card">
          <div class="card-head">
            <h2>操作历史</h2>
            <button class="btn-secondary" id="btnClearHistory">清空历史</button>
          </div>
          <div class="history-list" id="historyList">

  </div>

  <div class="toast" id="toast"></div>

  <script>

        query_path: "/status",
        task_id_paths: ["data.task_id"],

        video_url_paths: ["data.url"],

    const refs = {

      zhipuVideoModel: document.getElementById("zhipuVideoModel"),

      seedanceApiKey: document.getElementById("seedanceApiKey"),
      seedanceApiBase: document.getElementById("seedanceApiBase"),

      seedanceResolution: document.getElementById("seedanceResolution"),

      seedanceAspectRatio: document.getElementById("seedanceAspectRatio"),

      saveVideoLocal: document.getElementById("saveVideoLocal"),

      customImageJson: document.getElementById("customImageJson"),
      customVideoJson: document.getElementById("customVideoJson"),
      imgPrompt: document.getElementById("imgPrompt"),

      pollInterval: document.getElementById("pollInterval"),
      pollMaxRounds: document.getElementById("pollMaxRounds"),
      autoPollAfterSubmit: document.getElementById("autoPollAfterSubmit"),
      pollStatus: document.getElementById("pollStatus"),
      historyList: document.getElementById("historyList"),

      btnPing: document.getElementById("btnPing"),
      btnRefresh: document.getElementById("btnRefresh"),
      btnApplyConfig: document.getElementById("btnApplyConfig"),
      btnPersistConfig: document.getElementById("btnPersistConfig"),
      btnFormatJson: document.getElementById("btnFormatJson"),
      btnFillImageTpl: document.getElementById("btnFillImageTpl"),
      btnFillVideoTpl: document.getElementById("btnFillVideoTpl"),
      btnTestImage: document.getElementById("btnTestImage"),
      btnTestVideo: document.getElementById("btnTestVideo"),
      btnQueryVideo: document.getElementById("btnQueryVideo"),
      btnStartPoll: document.getElementById("btnStartPoll"),
      btnStopPoll: document.getElementById("btnStopPoll"),
      btnCopyResult: document.getElementById("btnCopyResult"),
      btnClearResult: document.getElementById("btnClearResult"),
      btnCopyCmd: document.getElementById("btnCopyCmd"),
      btnClearHistory: document.getElementById("btnClearHistory"),
    };

    let lastResult = null;
    let historyItems = [];
    let autoPollTimer = null;
    let autoPollRound = 0;
    let autoPollBusy = false;
    let autoPollMaxRounds = 40;

    function showToast(message, isError = false) {
      refs.toast.textContent = message;
      refs.toast.className = `toast show${isError ? " err" : ""}`;
      window.clearTimeout(showToast._timer);
      showToast._timer = window.setTimeout(() => {
        refs.toast.className = "toast";
      }, 2200);
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function setLoading(loading) {
      const buttons = [
        refs.btnPing,
        refs.btnRefresh,
        refs.btnApplyConfig,
        refs.btnPersistConfig,
        refs.btnFormatJson,
        refs.btnFillImageTpl,
        refs.btnFillVideoTpl,
        refs.btnTestImage,
        refs.btnTestVideo,
        refs.btnQueryVideo,
        refs.btnStartPoll,
      ];
      for (const btn of buttons) {
        btn.disabled = loading;
      }
    }

    function printResult(data) {
      lastResult = data;
      refs.output.textContent = JSON.stringify(data, null, 2);
      renderPreview(data);
    }

    function renderPreview(data) {
      const urls = [];
      const videoLinks = [];
      const payload = data?.data || {};

      if (Array.isArray(payload.urls)) {
        for (const link of payload.urls) {
          if (typeof link === "string" && link.trim()) {
            urls.push(link.trim());
          }
        }
      }

      if (typeof payload.video_url === "string" && payload.video_url.trim()) {
        videoLinks.push(payload.video_url.trim());
      }

      if (!urls.length && !videoLinks.length) {
        refs.previewArea.className = "preview-empty";
        refs.previewArea.textContent = "暂时没有可预览的图片/视频链接。";
        return;
      }

      const parts = [];
      parts.push('<div class="preview-grid">');
      for (const link of urls) {
        const safe = escapeHTML(link);
        parts.push(
          `<div class="preview-card"><img src="${safe}" alt="image preview" /><a href="${safe}" target="_blank" rel="noopener noreferrer">打开图片链接</a></div>`
        );
      }
      for (const link of videoLinks) {
        const safe = escapeHTML(link);
        parts.push(
          `<div class="preview-card"><div style="font-size:13px;color:#355c5a;">视频链接</div><a href="${safe}" target="_blank" rel="noopener noreferrer">${safe}</a></div>`
        );
      }
      parts.push("</div>");
      refs.previewArea.className = "";
      refs.previewArea.innerHTML = parts.join("");
    }

    async function req(url, method = "GET", body = null) {
      const options = {
        method,
        headers: { "Content-Type": "application/json" },
      };
      if (body !== null) {
        options.body = JSON.stringify(body);
      }
      const res = await fetch(url, options);
      const raw = await res.text();
      let data = null;
      try {
        data = raw ? JSON.parse(raw) : {};
      } catch (_) {
        data = { ok: false, error: raw || "响应不是有效JSON" };
      }
      printResult(data);
      if (!res.ok || !data.ok) {
        throw new Error(data.error || `HTTP ${res.status}`);
      }
      return data;
    }

    function renderState(state) {
      const enabledImages = Array.isArray(state.enabled_image_providers) ? state.enabled_image_providers : [];
      const enabledVideos = Array.isArray(state.enabled_video_providers) ? state.enabled_video_providers : [];

      refs.pillRunning.textContent = state.webui_running ? "WebUI 运行中" : "WebUI 未运行";
      refs.pillRunning.className = `pill ${state.webui_running ? "status-ok" : "status-off"}`;
      refs.pillImageProvider.textContent = `生图: ${state.selected_image_provider || "-"}`;
      refs.pillVideoProvider.textContent = `视频: ${state.selected_video_provider || "-"}`;

      refs.stateGrid.innerHTML = `
        <div class="status-item"><b>WebUI地址</b><span>${escapeHTML(state.webui_url || "-")}</span></div>
        <div class="status-item"><b>WebUI启用</b><span>${state.webui_enabled ? "true" : "false"}</span></div>
        <div class="status-item"><b>生图供应商</b><span>${escapeHTML(state.selected_image_provider || "-")}</span></div>
        <div class="status-item"><b>视频供应商</b><span>${escapeHTML(state.selected_video_provider || "-")}</span></div>
        <div class="status-item"><b>webui_host</b><span>${escapeHTML(state.webui_host || "-")}</span></div>
        <div class="status-item"><b>webui_port</b><span>${escapeHTML(String(state.webui_port || "-"))}</span></div>
      `;

      const tags = [];
      for (const name of enabledImages) {
        tags.push(`<span class="tag">生图: ${escapeHTML(name)}</span>`);
      }
      for (const name of enabledVideos) {
        tags.push(`<span class="tag">视频: ${escapeHTML(name)}</span>`);
      }
      refs.providerTags.innerHTML = tags.length ? tags.join("") : '<span class="tag">暂无可用供应商</span>';
    }

    function fillForm(state) {
      refs.selectedImage.value = state.selected_image_provider || "";
      refs.selectedVideo.value = state.selected_video_provider || "";
      refs.webuiHost.value = state.webui_host || "127.0.0.1";
      refs.webuiPort.value = String(state.webui_port || 8765);
      refs.webuiEnabled.checked = !!state.webui_enabled;
      refs.zhipuApiKey.value = state.zhipu_api_key || "";
      refs.zhipuApiBase.value = state.zhipu_api_base || "";
      refs.zhipuVideoModel.value = state.zhipu_video_model || "";
      refs.zhipuImageModel.value = state.zhipu_image_model || "";
      refs.zhipuVideoWithAudio.checked = !!state.zhipu_video_with_audio;
      refs.seedanceApiKey.value = state.seedance_api_key || "";
      refs.seedanceApiBase.value = state.seedance_api_base || "";
      refs.seedanceVideoModel.value = state.seedance_video_model || "";
      refs.seedanceResolution.value = state.seedance_resolution || "";
      refs.seedanceDuration.value = String(state.seedance_duration ?? 5);
      refs.seedanceAspectRatio.value = state.seedance_aspect_ratio || "";
      refs.seedanceGenerateAudio.checked = !!state.seedance_generate_audio;
      refs.seedanceFixedLens.checked = !!state.seedance_fixed_lens;
      refs.seedanceGeneratePath.value = state.seedance_generate_path || "";
      refs.seedanceStatusPath.value = state.seedance_status_path || "";
      refs.openaiImageApiKey.value = state.openai_image_api_key || "";
      refs.openaiImageApiBase.value = state.openai_image_api_base || "";
      refs.openaiImageGeneratePath.value = state.openai_image_generate_path || "";
      refs.openaiImageEditPath.value = state.openai_image_edit_path || "";
      refs.openaiImageModel.value = state.openai_image_model || "";
      refs.defaultImageSize.value = state.default_image_size || "";
      refs.defaultI2vPrompt.value = state.default_i2v_prompt || "";
      refs.defaultI2iPrompt.value = state.default_i2i_prompt || "";
      refs.requestTimeoutSeconds.value = String(state.request_timeout_seconds ?? 90);
      refs.downloadTimeoutSeconds.value = String(state.download_timeout_seconds ?? 120);
      refs.requestRetryCount.value = String(state.request_retry_count ?? 1);
      refs.minRequestIntervalSeconds.value = String(state.min_request_interval_seconds ?? 3);
      refs.maxImageSizeMb.value = String(state.max_image_size_mb ?? 10);
      refs.maxVideoSizeMb.value = String(state.max_video_size_mb ?? 100);
      refs.maxCacheFiles.value = String(state.max_cache_files ?? 20);
      refs.returnVideoUrl.checked = !!state.return_video_url;
      refs.returnImageUrl.checked = !!state.return_image_url;
      refs.attachVideoResult.checked = !!state.attach_video_result;
      refs.attachImageResult.checked = !!state.attach_image_result;
      refs.saveVideoLocal.checked = !!state.save_video_local;
      refs.saveImageLocal.checked = !!state.save_image_local;
      refs.customImageJson.value = state.custom_image_providers_json || "[]";
      refs.customVideoJson.value = state.custom_video_providers_json || "[]";
      updateCommandPreview();
    }

    async function refreshState(silent = false) {
      try {
        setLoading(true);
        const data = await req("/api/state");
        const state = data.data || {};
        renderState(state);
        fillForm(state);
        if (!silent) {
          showToast("状态已刷新");
        }
      } finally {
        setLoading(false);
      }
    }

    function parseJsonTextarea(el) {
      const raw = String(el.value || "").trim() || "[]";
      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          throw new Error("需要 JSON 数组");
        }
        el.classList.remove("bad-input");
        return JSON.stringify(parsed);
      } catch (err) {
        el.classList.add("bad-input");
        throw new Error(err.message || "JSON 格式错误");
      }
    }

    function collectConfigPayload(forPersist = false) {
      const payload = {
        selected_image_provider: refs.selectedImage.value.trim(),
        selected_video_provider: refs.selectedVideo.value.trim(),
        webui_host: refs.webuiHost.value.trim(),
        webui_port: refs.webuiPort.value.trim(),
        webui_enabled: refs.webuiEnabled.checked,
        zhipu_api_key: refs.zhipuApiKey.value.trim(),
        zhipu_api_base: refs.zhipuApiBase.value.trim(),
        zhipu_video_model: refs.zhipuVideoModel.value.trim(),
        zhipu_image_model: refs.zhipuImageModel.value.trim(),
        zhipu_video_with_audio: refs.zhipuVideoWithAudio.checked,
        seedance_api_key: refs.seedanceApiKey.value.trim(),
        seedance_api_base: refs.seedanceApiBase.value.trim(),
        seedance_video_model: refs.seedanceVideoModel.value.trim(),
        seedance_resolution: refs.seedanceResolution.value.trim(),
        seedance_duration: refs.seedanceDuration.value.trim(),
        seedance_aspect_ratio: refs.seedanceAspectRatio.value.trim(),
        seedance_generate_audio: refs.seedanceGenerateAudio.checked,
        seedance_fixed_lens: refs.seedanceFixedLens.checked,
        seedance_generate_path: refs.seedanceGeneratePath.value.trim(),
        seedance_status_path: refs.seedanceStatusPath.value.trim(),
        openai_image_api_key: refs.openaiImageApiKey.value.trim(),
        openai_image_api_base: refs.openaiImageApiBase.value.trim(),
        openai_image_generate_path: refs.openaiImageGeneratePath.value.trim(),
        openai_image_edit_path: refs.openaiImageEditPath.value.trim(),
        openai_image_model: refs.openaiImageModel.value.trim(),
        default_image_size: refs.defaultImageSize.value.trim(),
        default_i2v_prompt: refs.defaultI2vPrompt.value.trim(),
        default_i2i_prompt: refs.defaultI2iPrompt.value.trim(),
        request_timeout_seconds: refs.requestTimeoutSeconds.value.trim(),
        download_timeout_seconds: refs.downloadTimeoutSeconds.value.trim(),
        request_retry_count: refs.requestRetryCount.value.trim(),
        min_request_interval_seconds: refs.minRequestIntervalSeconds.value.trim(),

        max_video_size_mb: refs.maxVideoSizeMb.value.trim(),
        max_cache_files: refs.maxCacheFiles.value.trim(),
        return_video_url: refs.returnVideoUrl.checked,
        return_image_url: refs.returnImageUrl.checked,
        attach_video_result: refs.attachVideoResult.checked,
        attach_image_result: refs.attachImageResult.checked,
        save_video_local: refs.saveVideoLocal.checked,
        save_image_local: refs.saveImageLocal.checked,
        custom_image_providers_json: parseJsonTextarea(refs.customImageJson),
        custom_video_providers_json: parseJsonTextarea(refs.customVideoJson),
      };
      if (!forPersist) {
        delete payload.webui_enabled;
      }
      return payload;
    }

    function updateCommandPreview() {
      const imageProvider = refs.selectedImage.value.trim() || "<生图供应商>";
      const videoProvider = refs.selectedVideo.value.trim() || "<视频供应商>";
      const imagePrompt = refs.imgPrompt.value.trim() || "<提示词>";
      const imageSize = refs.imgSize.value.trim() || "1024x1024";
      const videoPrompt = refs.videoPrompt.value.trim() || "<提示词>";
      const taskId = refs.videoTaskId.value.trim() || "<task_id>";
      refs.cmdPreview.textContent =
`/kc供应商
/kc生图 ${imageSize} ${imagePrompt}
/kc视频 ${videoPrompt}
/kc视频查询 ${taskId}

# 你当前设定
# selected_image_provider=${imageProvider}
# selected_video_provider=${videoProvider}`;
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        historyItems = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(historyItems)) {
          historyItems = [];
        }
      } catch (_) {
        historyItems = [];
      }
      renderHistory();
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(historyItems.slice(0, 40)));
    }

    function addHistory(item) {
      const record = {
        time: new Date().toISOString(),
        ...item,
      };
      historyItems.unshift(record);
      if (historyItems.length > 40) {
        historyItems = historyItems.slice(0, 40);
      }
      saveHistory();
      renderHistory();
    }

    function renderHistory() {
      if (!historyItems.length) {
        refs.historyList.innerHTML = '<div class="preview-empty">暂无历史记录。</div>';
        return;
      }
      const html = [];
      for (const item of historyItems) {
        const localTime = new Date(item.time).toLocaleString();
        const taskBtn = item.task_id ? `<button class="btn-secondary" data-task="${escapeHTML(item.task_id)}">填入task_id</button>` : "";
        html.push(
          `<div class="history-item">
            <b>${escapeHTML(item.action || "操作")}</b>
            <div class="history-meta">
              时间: ${escapeHTML(localTime)}<br/>
              状态: ${escapeHTML(item.status || "-")} | 供应商: ${escapeHTML(item.provider || "-")}<br/>
              ${item.message ? `信息: ${escapeHTML(item.message)}` : ""}
            </div>
            <div class="history-actions">${taskBtn}</div>
          </div>`
        );
      }
      refs.historyList.innerHTML = html.join("");
    }

    function stopAutoPoll(note = "轮询状态: 已停止") {
      if (autoPollTimer) {
        clearInterval(autoPollTimer);
        autoPollTimer = null;
      }
      autoPollBusy = false;
      refs.pollStatus.textContent = note;
    }

    function startAutoPoll() {
      const taskId = refs.videoTaskId.value.trim();
      if (!taskId) {
        showToast("请先填写 task_id", true);
        return;
      }
      const interval = Math.max(2, Number.parseInt(refs.pollInterval.value || "5", 10) || 5);
      autoPollMaxRounds = Math.max(1, Number.parseInt(refs.pollMaxRounds.value || "40", 10) || 40);
      autoPollRound = 0;
      stopAutoPoll("轮询状态: 启动中...");
      refs.pollStatus.textContent = `轮询状态: 运行中 (0/${autoPollMaxRounds})`;
      autoPollTimer = setInterval(async () => {
        if (autoPollBusy) {
          return;
        }
        autoPollBusy = true;
        try {
          autoPollRound += 1;
          refs.pollStatus.textContent = `轮询状态: 运行中 (${autoPollRound}/${autoPollMaxRounds})`;
          const ret = await req("/api/test/video-query", "POST", { task_id: taskId });
          const data = ret.data || {};
          addHistory({
            action: "轮询视频任务",
            status: data.status || "",
            provider: data.provider || "",
            task_id: data.task_id || taskId,
            message: data.fail_reason || "",
          });
          const status = String(data.status || "").toLowerCase();
          if (["success", "failed", "timeout"].includes(status)) {
            stopAutoPoll(`轮询状态: 已结束 (${status})`);
            showToast(`轮询结束: ${status}`);
          } else if (autoPollRound >= autoPollMaxRounds) {
            stopAutoPoll("轮询状态: 达到上限，已停止");
            showToast("轮询达到上限", true);
          }
        } catch (err) {
          stopAutoPoll("轮询状态: 异常中断");
          showToast(`轮询失败: ${err.message}`, true);
        } finally {
          autoPollBusy = false;
        }
      }, interval * 1000);
      showToast("自动轮询已启动");
    }

    refs.historyList.addEventListener("click", (event) => {
      const target = event.target.closest("button[data-task]");
      if (!target) {
        return;
      }
      const taskId = target.getAttribute("data-task") || "";
      refs.videoTaskId.value = taskId;
      updateCommandPreview();
      showToast("已填入 task_id");
    });

    refs.btnPing.onclick = async () => {
      const start = performance.now();
      try {
        setLoading(true);
        await req("/api/ping");
        const cost = Math.max(1, Math.round(performance.now() - start));
        refs.pillPing.textContent = `延迟: ${cost}ms`;
        showToast(`健康检查成功 (${cost}ms)`);
      } catch (err) {
        refs.pillPing.textContent = "延迟: 失败";
        showToast(`健康检查失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnRefresh.onclick = async () => {
      try {
        await refreshState();
      } catch (err) {
        showToast(`刷新失败: ${err.message}`, true);
      }
    };

    refs.btnFormatJson.onclick = () => {
      try {
        const img = JSON.parse(String(refs.customImageJson.value || "").trim() || "[]");
        const vid = JSON.parse(String(refs.customVideoJson.value || "").trim() || "[]");
        refs.customImageJson.value = JSON.stringify(img, null, 2);
        refs.customVideoJson.value = JSON.stringify(vid, null, 2);
        refs.customImageJson.classList.remove("bad-input");
        refs.customVideoJson.classList.remove("bad-input");
        showToast("JSON 已格式化");
      } catch (err) {
        showToast(`JSON 格式化失败: ${err.message}`, true);
      }
    };

    refs.btnFillImageTpl.onclick = () => {
      refs.customImageJson.value = JSON.stringify(IMAGE_TEMPLATE, null, 2);
      refs.customImageJson.classList.remove("bad-input");
      showToast("已填充生图模板");
    };

    refs.btnFillVideoTpl.onclick = () => {
      refs.customVideoJson.value = JSON.stringify(VIDEO_TEMPLATE, null, 2);
      refs.customVideoJson.classList.remove("bad-input");
      showToast("已填充视频模板");
    };

    refs.btnApplyConfig.onclick = async () => {
      try {
        setLoading(true);
        const ret = await req("/api/runtime-config", "POST", collectConfigPayload(false));
        await refreshState(true);
        addHistory({
          action: "应用运行时配置",
          status: "ok",
          provider: `${ret.data?.selected_image_provider || "-"} / ${ret.data?.selected_video_provider || "-"}`,
          message: "未写入配置文件",
        });
        showToast("运行时配置已应用");
      } catch (err) {
        showToast(`应用失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnPersistConfig.onclick = async () => {
      try {
        setLoading(true);
        const ret = await req("/api/persist-config", "POST", collectConfigPayload(true));
        await refreshState(true);
        addHistory({
          action: "持久化保存配置",
          status: "ok",
          provider: `${ret.data?.selected_image_provider || "-"} / ${ret.data?.selected_video_provider || "-"}`,
          message: "已写入插件配置",
        });
        showToast("配置已持久化保存");
      } catch (err) {
        showToast(`保存失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnTestImage.onclick = async () => {
      try {
        setLoading(true);
        const ret = await req("/api/test/image", "POST", {
          prompt: refs.imgPrompt.value.trim(),
          size: refs.imgSize.value.trim(),
        });
        const data = ret.data || {};
        addHistory({
          action: "生图测试",
          status: data.status || "",
          provider: data.provider || "",
          message: `返回 ${data.count || 0} 张`,
        });
        showToast("生图请求已发送");
      } catch (err) {
        showToast(`生图失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnTestVideo.onclick = async () => {
      try {
        setLoading(true);
        const ret = await req("/api/test/video", "POST", {
          prompt: refs.videoPrompt.value.trim(),
        });
        const data = ret.data || {};
        refs.videoTaskId.value = data.task_id || "";
        updateCommandPreview();
        addHistory({
          action: "提交视频任务",
          status: data.status || "",
          provider: data.provider || "",
          task_id: data.task_id || "",
          message: "任务已提交",
        });
        showToast("视频任务已提交");
        if (refs.autoPollAfterSubmit.checked && data.task_id) {
          startAutoPoll();
        }
      } catch (err) {
        showToast(`提交失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnQueryVideo.onclick = async () => {
      try {
        setLoading(true);
        const ret = await req("/api/test/video-query", "POST", {
          task_id: refs.videoTaskId.value.trim(),
        });
        const data = ret.data || {};
        addHistory({
          action: "查询视频任务",
          status: data.status || "",
          provider: data.provider || "",
          task_id: data.task_id || refs.videoTaskId.value.trim(),
          message: data.fail_reason || "",
        });
        showToast("任务状态已更新");
      } catch (err) {
        showToast(`查询失败: ${err.message}`, true);
      } finally {
        setLoading(false);
      }
    };

    refs.btnCopyResult.onclick = async () => {
      try {
        const text = lastResult ? JSON.stringify(lastResult, null, 2) : refs.output.textContent;
        await navigator.clipboard.writeText(text);
        showToast("结果已复制");
      } catch (_) {
        showToast("复制失败，请手动复制", true);
      }
    };

    refs.btnClearResult.onclick = () => {
      lastResult = null;
      refs.output.textContent = "等待操作...";
      refs.previewArea.className = "preview-empty";
      refs.previewArea.textContent = "暂时没有可预览的图片/视频链接。";
      showToast("结果已清空");
    };

    refs.btnStartPoll.onclick = () => {
      startAutoPoll();
    };

    refs.btnStopPoll.onclick = () => {
      stopAutoPoll("轮询状态: 已手动停止");
      showToast("轮询已停止");
    };

    refs.btnCopyCmd.onclick = async () => {
      try {
        await navigator.clipboard.writeText(refs.cmdPreview.textContent || "");
        showToast("命令已复制");
      } catch (_) {
        showToast("复制失败，请手动复制", true);
      }
    };

    refs.btnClearHistory.onclick = () => {
      historyItems = [];
      saveHistory();
      renderHistory();
      showToast("历史已清空");
    };

    for (const el of [
      refs.selectedImage,
      refs.selectedVideo,
      refs.imgPrompt,
      refs.imgSize,
      refs.videoPrompt,
      refs.videoTaskId,
    ]) {
      el.addEventListener("input", updateCommandPreview);
    }

    loadHistory();
    refreshState(true).catch((err) => {
      printResult({ ok: false, error: err.message });
      showToast(`初始化失败: ${err.message}`, true);
    });
  </script>
</body>
</html>
